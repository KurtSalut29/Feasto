# Start everything:   docker compose up -d --build
# Stop everything:    docker compose down
# Every long-running service has "restart: unless-stopped", so after quitting and
# reopening Docker Desktop the whole stack comes back on its own.
name: feasto

x-server-env: &server-env
  DATABASE_URL: postgresql://feasto:feasto@postgres:5432/feasto
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://feasto:feasto@rabbitmq:5672
  RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
  PORT: "4000"
  # Read from the .env file next to this one (copy .env.example to create it)
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  UPLOAD_DIR: /app/uploads
  DOCUMENT_DIR: /app/documents
  # Road distances for the delivery fee (optional: without it, distances are estimated)
  MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
  # Push notifications to phones while Feasto is closed (optional: without them, only in the app)
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@feasto.com}
  # Requests one signed-in account may make per minute (0 = off, for the stress test in loadtest/)
  API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-1200}

# Settings shared by the three API copies.
x-api: &api
  image: feasto-server:dev
  build: ./server
  restart: unless-stopped
  mem_limit: 256m
  # Every API copy shares one photo folder and one private documents folder.
  # Only the photos are mounted into Nginx.
  volumes:
    - uploads:/app/uploads
    - documents:/app/documents
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feasto
      POSTGRES_PASSWORD: feasto
      POSTGRES_DB: feasto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feasto -d feasto"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: feasto
      RABBITMQ_DEFAULT_PASS: feasto
    ports:
      - "5672:5672"   # used by the API and worker
      - "15672:15672" # web dashboard: http://localhost:15672 (feasto / feasto)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs once: applies database migrations, creates the admin account, then exits.
  migrate:
    build:
      context: ./server
      target: build
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/seed.js"]
    environment:
      <<: *server-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@feasto.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  # Wipes everything and loads the demo stores, accounts and orders. Not started by
  # "docker compose up"; run it on purpose with:  docker compose run --rm demo
  demo:
    profiles: ["tools"]
    build:
      context: ./server
      target: build
    command: ["node", "dist/demo.js"]
    environment:
      <<: *server-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@feasto.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - uploads:/app/uploads
      - documents:/app/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Real Naval stores instead of the demo (wipes everything first). See server/naval/README.md.
  # Adds 30 days of sample orders and reviews to the stores (only adds; see server/src/history.ts)
  history:
    profiles: ["tools"]
    build:
      context: ./server
      target: build
    command: ["node", "dist/history.js"]
    environment:
      <<: *server-env
    volumes:
      - documents:/app/documents
    depends_on:
      postgres:
        condition: service_healthy

  naval:
    profiles: ["tools"]
    build:
      context: ./server
      target: build
    command: ["node", "dist/naval.js"]
    environment:
      <<: *server-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@feasto.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      STORE_PASSWORD: ${STORE_PASSWORD:-demo1234}
    volumes:
      - uploads:/app/uploads
      - documents:/app/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-1:
    <<: *api
    environment:
      <<: *server-env
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    environment:
      <<: *server-env
      INSTANCE_ID: api-2

  api-3:
    <<: *api
    environment:
      <<: *server-env
      INSTANCE_ID: api-3

  # The workers: workers.js starts one worker process per CPU Docker gives it (4 CPUs →
  # worker-1 to worker-4), not a fixed number. They share the RabbitMQ queues, so jobs
  # (orders, payments, report parts) spread across all of them, and a crashed one is
  # started again. Set WORKER_COUNT in .env to choose the number yourself.
  worker:
    <<: *api
    command: ["node", "dist/workers.js"]
    # Several Node processes share this container, so it gets more memory than one API copy
    mem_limit: 1g
    environment:
      <<: *server-env
      INSTANCE_ID: workers
      WORKER_COUNT: ${WORKER_COUNT:-}
    # Workers never read permits or licenses
    volumes:
      - uploads:/app/uploads

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80" # http://localhost:8080/api/health
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/srv/uploads:ro
    depends_on:
      - api-1
      - api-2
      - api-3

volumes:
  documents:
  pgdata:
  uploads:
