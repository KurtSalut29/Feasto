<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline · Feasto</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: #ffffff; color: #1f2937; text-align: center;
    font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 320px; }
  img { width: 112px; height: 112px; border-radius: 28px; }
  h1 { margin-top: 20px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  p { margin-top: 8px; font-size: 15px; line-height: 1.5; color: #6b7280; }
  button {
    margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 12px;
    background: #d24600; color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #fe5502; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>Feasto needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  // Come back on our own as soon as the connection returns
  addEventListener("online", () => location.reload());
</script>
</body>
</html>
