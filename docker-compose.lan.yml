# The laptop as the server for a class test on one WiFi (see DEPLOY.md). Start it with
#   .\infra\lan\start.ps1        and stop it with   .\infra\lan\stop.ps1
# Adds the web app and Caddy (HTTPS on the laptop's WiFi address), makes login cookies
# HTTPS-only, and closes the database, Redis and RabbitMQ to the WiFi. Nginx stays on 8080 so
# `npm run dev` keeps working.

x-prod-env: &prod-env
  COOKIE_SECURE: "true"

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  rabbitmq:
    ports: !reset []

  api-1:
    environment:
      <<: *prod-env
  api-2:
    environment:
      <<: *prod-env
  api-3:
    environment:
      <<: *prod-env
  worker:
    environment:
      <<: *prod-env

  web:
    build:
      context: ./web
      args:
        API_URL: http://nginx
        NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    restart: unless-stopped
    environment:
      API_URL: http://nginx
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      - nginx

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Run infra/lan/start.ps1, which sets SITE_ADDRESS}
    volumes:
      - ./infra/caddy/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/routes.caddy:/etc/caddy/routes.caddy:ro
      - ./infra/lan/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - nginx

volumes:
  caddy-data:
  caddy-config:
