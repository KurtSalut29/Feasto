# Nginx is the single entry point. It spreads API requests across the
# three API containers in turn (round robin).
upstream feasto_api {
    server api-1:4000;
    server api-2:4000;
    server api-3:4000;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://feasto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # If one API copy is down, retry the request on the next one.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
    }
}
