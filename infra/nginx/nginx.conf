# Nginx is the single entry point. It spreads API requests across the
# three API containers in turn (round robin).
# Docker's internal DNS. API containers get new IP addresses when they are recreated
# (e.g. after a rebuild), so Nginx looks the names up again every 5 seconds instead of
# remembering the addresses it saw at startup.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream feasto_api {
    zone feasto_api 64k;
    server api-1:4000 resolve;
    server api-2:4000 resolve;
    server api-3:4000 resolve;
}

server {
    listen 80;

    # Photos uploaded through any API copy, served straight from the shared volume
    location /uploads/ {
        alias /srv/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Live updates (Server-Sent Events): long-lived, so no buffering and a long timeout
    location /api/me/events {
        proxy_pass http://feasto_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://feasto_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # If one API copy is down, retry the request on the next one.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
    }
}
